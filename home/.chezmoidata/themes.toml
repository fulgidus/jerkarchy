# Colour themes for jerkarchy (chezmoi data). Each theme maps the same roles;
# templates read the active one: `index .themes .theme`. Palettes come from
# each theme's upstream project (see `source`), not from any other distro.
# Roles: bg (wallpaper/bar), bg_alt (panels), border, fg, fg_bright, fg_dim,
# fg_mute, accent (focus, selection), accent2 (alerts, urgent), ok, warn, err,
# ansi (16 terminal colours: 0-7 normal, 8-15 bright).

[themes.jerkarchy]
title = "jerkarchy"
source = "jerkarchy"
light = false
bg = "#0a0a0f"
bg_alt = "#12121a"
border = "#2a2a35"
fg = "#c8c8d0"
fg_bright = "#e5e1e7"
fg_dim = "#8a8aa0"
fg_mute = "#55556a"
accent = "#00f0ff"
accent2 = "#ff2b6d"
ok = "#00ff9f"
warn = "#ffcc00"
err = "#ff2b6d"
ansi = ["#1a1a22", "#ff2b6d", "#00ff9f", "#ffcc00", "#3d7eff", "#c74ded", "#00f0ff", "#c8c8d0", "#55556a", "#ff5c8a", "#5cffbf", "#ffe066", "#6e9eff", "#d980f5", "#66f6ff", "#ffffff"]

