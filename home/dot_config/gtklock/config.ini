# gtklock — used by session-lock when installed (swaylock otherwise).
# Colours live in style.css (from the theme); the background is the
# wallpaper's current frame, passed by session-lock.
[main]
time-format=%H:%M
date-format=%A %d %B
idle-hide=true
idle-timeout=20
modules=/usr/lib/gtklock/powerbar-module.so;/usr/lib/gtklock/playerctl-module.so;/usr/lib/gtklock/userinfo-module.so
