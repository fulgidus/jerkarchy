# fuzzel style for drop-down menus opened from waybar (wifi-menu, …).
# Same palette/font/square borders as waybar, anchored under the bar's right end.
[main]
font=JetBrainsMono Nerd Font:size=10
dpi-aware=no
anchor=top-right
x-margin=6
y-margin=4
layer=overlay
lines=12
minimal-lines=yes
width=44
horizontal-pad=12
vertical-pad=8
inner-pad=6
prompt="› "
exit-on-keyboard-focus-loss=yes

[colors]
background=0a0a0fff
text=c8c8d0ff
prompt=00f0ffff
placeholder=55556aff
input=e5e1e7ff
match=ff2b6dff
selection=00f0ffff
selection-text=0a0a0fff
selection-match=ff2b6dff
counter=55556aff
border=2a2a35ff

[border]
width=1
radius=0
