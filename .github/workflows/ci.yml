# CI: run ci/check.sh in an Arch container whose package mirror is pinned to
# the date in SNAPSHOT (Arch Linux Archive), so every run sees the same
# package versions. GitHub only receives main (push mirror), so this runs on
# releases; ci/check.sh is also run locally before merging into develop.
#
# On main, when VERSION names a release that doesn't exist yet, the same job
# publishes it (tag vX.Y.Z + the binaries it just built and tested), and the
# site/ directory is deployed to GitHub Pages.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base
    permissions:
      contents: write  # create the release
    steps:
      - name: Bootstrap git (needed for full history checks)
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin pacman to the SNAPSHOT date
        run: |
          snap=$(tr - / < SNAPSHOT)
          echo "Server = https://archive.archlinux.org/repos/${snap}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          cat /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm

      - name: Install check dependencies
        run: |
          pacman -S --noconfirm --needed bash python sway fuzzel chezmoi zig shellcheck jq github-cli libcap
          # Arch ships sway with cap_sys_nice; GitHub's containers may not exec
          # binaries carrying file capabilities ("Operation not permitted").
          # CI only runs `sway -C`, which doesn't need it.
          setcap -r "$(command -v sway)"

      - name: Run ci/check.sh
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
          CI_OUT: /tmp/bin
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ci/check.sh

      - name: Publish the release if VERSION is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=v$(cat VERSION)
          if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; exit 0; fi
          dir=jerkarchy-$(cat VERSION)-x86_64
          mkdir -p "$dir"
          cp /tmp/bin/jerkwall /tmp/bin/jerkslide /tmp/bin/jerksaver /tmp/bin/jerkprompt /tmp/bin/sway-binds README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          awk -v v="## $v" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$v" "$dir.tar.gz" "$dir.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "jerkarchy $v" --notes-file notes.md

  # Every theme, rendered in a headless sway: attached to the release and kept
  # as a workflow artifact. Doesn't block a release if it breaks.
  screenshots:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base
    continue-on-error: true
    permissions:
      contents: write  # attach to the release
    steps:
      - name: Bootstrap git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Pin pacman to the SNAPSHOT date
        run: |
          snap=$(tr - / < SNAPSHOT)
          echo "Server = https://archive.archlinux.org/repos/${snap}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm

      - name: Install the desktop (headless) and tools
        run: |
          pacman -S --noconfirm --needed bash sway waybar wezterm fuzzel grim jq chezmoi zig wayland \
            ttf-jetbrains-mono-nerd dbus mesa procps-ng libcap github-cli ffmpeg
          setcap -r "$(command -v sway)"  # see the check job

      - name: Build jerkwall and jerksaver (wallpaper, screensavers)
        run: mkdir -p "$HOME/.local/bin" && ZIG=zig src/jerkwall/build.sh && ZIG=zig src/jerksaver/build.sh

      - name: Render every theme
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          ci/screenshots.sh --gifs shots
          ci/site-gallery.sh shots gallery-site

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            shots/*.png
            shots/*.gif

      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery-site

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=v$(cat VERSION)
          tar -czf "jerkarchy-$v-screenshots.tar.gz" -C shots .  # PNGs + screensaver GIFs
          gh release upload "$v" "jerkarchy-$v-screenshots.tar.gz" --clobber

  pages:
    needs: [check, screenshots]
    # deploy even if the screenshots broke (the gallery is then left out)
    if: always() && needs.check.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the gallery (from the screenshots job)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gallery
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
